services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASS:-Password123!}
      - MSSQL_PID=Developer
      - MSSQL_AGENT_ENABLED=true
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -No"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
    networks:
      - sim_network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    environment:
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    ports:
      - "9092:9092"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    networks:
      - sim_network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Debezium Connect + the Approach 4 JDBC SMT (built from ./debezium).
  # Connectors are created and deleted per run by the simulator; none run between runs.
  debezium:
    build: ./debezium
    image: sim-debezium:2.7.0
    container_name: debezium
    depends_on:
      kafka:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    environment:
      - BOOTSTRAP_SERVERS=kafka:29092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
    ports:
      - "8083:8083"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 4096M
    networks:
      - sim_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Flink + Kafka SQL connector + the Approach 3 job (built from ./flink).
  # The job is submitted only for Approach 3 runs and cancelled when they end.
  jobmanager:
    build: ./flink
    image: sim-flink:1.18.1
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    networks:
      - sim_network

  taskmanager:
    build: ./flink
    image: sim-flink:1.18.1
    container_name: flink-taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
    networks:
      - sim_network

  simulator:
    build: ./simulator
    container_name: simulator
    environment:
      - DB_HOST=sqlserver
      - DB_PASS=${DB_PASS:-Password123!}
      - KAFKA_BROKERS=kafka:29092
      - DEBEZIUM_URL=http://debezium:8083
      - FLINK_URL=http://jobmanager:8081
      - RESULTS_DIR=/results
    ports:
      - "3001:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docs/results:/results
    networks:
      - sim_network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_healthy
      debezium:
        condition: service_healthy
      jobmanager:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2048M
    # Optional: run the simulator on the host with `npm run dev` instead.
    profiles: ["app"]

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - sim_network

networks:
  sim_network:
    driver: bridge
